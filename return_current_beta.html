      card.addEventListener('click', (e)=>{
        if(e.target.closest('.delete-x')) return;
        openWorkflow(parseInt(card.dataset.idx));
      });
    });
    main.querySelectorAll('.delete-x').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        const idx = parseInt(btn.dataset.deleteIdx);
        state.workflows.splice(idx,1);
        safeSaveWorkflows();
        toast('Workflow deleted');
        renderWorkflowList();
      });
    });
  }
  setupDropZone();
}

function setupDropZone(){
  const dz = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', e=>{
    if(e.target.files[0]) handleImportFile(e.target.files[0]);
  });
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e=>{
    e.preventDefault();
    dz.classList.remove('drag-over');
    if(e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0]);
  });
}

async function handleImportFile(file){
  try{
    let apiGraph, uiGraph, thumb = '';
    if(/\.json$/i.test(file.name)){
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(parsed.nodes && parsed.links !== undefined){
        // UI workflow format — convert via server object_info
        uiGraph = parsed;
        apiGraph = await convertUiToApi(parsed);
      } else if(Object.values(parsed).some(v => v && typeof v === 'object' && v.class_type)){
        // API format — directly usable
        apiGraph = parsed;
        uiGraph = null;
      } else {
        throw new Error('Unrecognized JSON format — export from ComfyUI as workflow or API format');
      }
    } else {
      const extracted = await extractWorkflowFromPng(file);
      apiGraph = extracted.apiGraph;
      uiGraph = extracted.uiGraph;
      thumb = await generateThumbnail(file, 96, 0.5);
    }
    const titleMap = getUiTitleMap(uiGraph);
    const fields = buildEditableFields(apiGraph, titleMap);
    const name = file.name.replace(/\.(png|json)$/i,'');
    const saved = {name, apiGraph, titleMap, thumb, fieldCount: fields.length};
    state.workflows.unshift(saved);
    safeSaveWorkflows();
    toast(`Imported "${name}" — ${fields.length} fields found`);
    renderWorkflowList();
  }catch(e){
    toast(e.message || 'Could not read workflow from this file');
    console.error(e);
  }
}

/** Convert ComfyUI UI-format workflow JSON to API format using server object_info */
async function convertUiToApi(ui){
  if(!state.connected) throw new Error('Connect to your server first — JSON conversion needs node definitions');
  // Fetch full object_info (cached per session)
  if(!state._fullObjectInfo){
    const res = await fetch(`${baseUrl()}/object_info`);
    state._fullObjectInfo = await res.json();
  }
  const objectInfo = state._fullObjectInfo;
  const api = {};
  const linkMap = {};
  (ui.links || []).forEach(l => {
    if(Array.isArray(l)) linkMap[l[0]] = [String(l[1]), l[2]];
    else if(l && l.id !== undefined) linkMap[l.id] = [String(l.origin_id), l.origin_slot];
  });
  const CTRL_VALUES = ['fixed','increment','decrement','randomize'];

  for(const n of (ui.nodes || [])){
    if(n.mode === 2 || n.mode === 4) continue; // muted or bypassed
    // Skip pure UI nodes
    if(['Note','MarkdownNote','Reroute','PrimitiveNode'].includes(n.type)) continue;
    const def = objectInfo[n.type];
    if(!def) throw new Error(`Unknown node type "${n.type}" — is the custom node installed on the server?`);

    const inputs = {};
    const linkedNames = new Set();
    (n.inputs || []).forEach(inp => {
      if(inp.link != null && linkMap[inp.link]){
        inputs[inp.name] = linkMap[inp.link];
        linkedNames.add(inp.name);
      }
    });

    // Determine widget input names in definition order
    const widgetNames = [];
    const allDefs = {...(def.input?.required || {}), ...(def.input?.optional || {})};
    for(const [name, spec] of Object.entries(allDefs)){
      const t = Array.isArray(spec) ? spec[0] : spec;
      if(Array.isArray(t) || ['INT','FLOAT','STRING','BOOLEAN'].includes(t)){
        widgetNames.push(name);
      }
    }

    let wv = Array.isArray(n.widgets_values) ? n.widgets_values : [];
    let wi = 0;
    for(const name of widgetNames){
      if(linkedNames.has(name)) continue; // converted-to-input widgets don't consume a slot in modern ComfyUI
      if(wi >= wv.length) break;
      inputs[name] = wv[wi];
      wi++;
      // Skip the control_after_generate widget slot after seeds
      if((name === 'seed' || name === 'noise_seed') && wi < wv.length &&
         typeof wv[wi] === 'string' && CTRL_VALUES.includes(wv[wi])){
        wi++;
      }
    }
    api[String(n.id)] = {class_type: n.type, inputs};
  }
  return api;
}

/** Resize an image file to a small JPEG thumbnail via canvas */
function generateThumbnail(file, size, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      // Cover-crop to square
      const s = Math.min(img.width, img.height);
      const sx = (img.width - s) / 2;
      const sy = (img.height - s) / 2;
      ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
      resolve(canvas.toDataURL('image/jpeg', quality));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = ()=> resolve('');
    img.src = URL.createObjectURL(file);
  });
}

/** Save workflows to localStorage, gracefully handling quota errors */
function safeSaveWorkflows(){
  const data = JSON.stringify(state.workflows);
  try{
    localStorage.setItem('returncurrent_workflows', data);
  }catch(e){
    // Quota exceeded — try stripping thumbnails from older workflows
    console.warn('Storage quota hit, stripping old thumbnails…');
    for(let i = state.workflows.length - 1; i >= 1; i--){
      state.workflows[i].thumb = '';
    }
    try{
      localStorage.setItem('returncurrent_workflows', JSON.stringify(state.workflows));
    }catch(e2){
      // Still too big — drop oldest workflows until it fits
      while(state.workflows.length > 1){
        state.workflows.pop();
        try{
          localStorage.setItem('returncurrent_workflows', JSON.stringify(state.workflows));
          break;
        }catch(e3){}
      }
      console.warn('Trimmed stored workflows to fit quota');
    }
  }
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ---- Editor ---- */
function openWorkflow(idx){
  try{
    const saved = state.workflows[idx];
    const fields = buildEditableFields(saved.apiGraph, saved.titleMap || {});
    state.currentWorkflow = {saved, apiGraph: saved.apiGraph, fields};
    history.pushState({editor: true}, '');
    renderEditor();
  }catch(e){
    console.error('openWorkflow error:', e);
    toast(`Error: ${e.message}`);
  }
}

/* ---- LoRA organization: filter video loras, nest by folder, prioritize model-matching ---- */
function buildOrganizedLoraOptions(apiGraph){
  if(!state.availableLoras.length) return '';

  // 1. Filter out video LoRAs (wan 2.1/2.2 and video-specific ones)
  const VIDEO_FILTER = /\b(wan[_ ]?2[\._]?[12]|wan[_ ]?video|cogvideo|animatediff|svd[_ ]|video[_ ]lora|mochi|hunyuan[_ ]?video)\b/i;
  const filtered = state.availableLoras.filter(l => !VIDEO_FILTER.test(l));

  // 2. Detect current model name to prioritize matching LoRA folders
  let modelHint = '';
  if(apiGraph){
    for(const nodeId in apiGraph){
      const inputs = apiGraph[nodeId].inputs;
      if(inputs.ckpt_name && typeof inputs.ckpt_name === 'string'){
        modelHint = inputs.ckpt_name.toLowerCase();
        break;
      }
      if(inputs.unet_name && typeof inputs.unet_name === 'string'){
        modelHint = inputs.unet_name.toLowerCase();
        break;
      }
    }
  }

  // 3. Group by top-level folder (normalize slashes)
  const groups = {};
  const rootItems = [];
  filtered.forEach(l => {
    const norm = l.replace(/\\/g, '/');
    const slashIdx = norm.indexOf('/');
    if(slashIdx === -1){
      rootItems.push(l);
    } else {
      const folder = norm.substring(0, slashIdx);
      if(!groups[folder]) groups[folder] = [];
      groups[folder].push(l);
    }
  });

  // 4. Sort folders: model-matching folders first, then alphabetical
  const folderNames = Object.keys(groups).sort((a, b) => {
    const aMatch = modelHint && modelHint.includes(a.toLowerCase()) ? 0 : 1;
    const bMatch = modelHint && modelHint.includes(b.toLowerCase()) ? 0 : 1;
    if(aMatch !== bMatch) return aMatch - bMatch;
    return a.localeCompare(b);
  });

  // 5. Build HTML with optgroups
  let html = '';

  // Model-matching folders get a star prefix
  folderNames.forEach(folder => {
    const isMatch = modelHint && modelHint.includes(folder.toLowerCase());
    const label = isMatch ? `★ ${folder}` : folder;
    html += `<optgroup label="${escapeHtml(label)}">`;
    groups[folder].sort((a,b) => a.localeCompare(b)).forEach(l => {
      const displayName = l.replace(/\\/g,'/').split('/').pop();
      html += `<option value="${escapeHtml(l)}">${escapeHtml(displayName)}</option>`;
    });
    html += `</optgroup>`;
  });

  // Root-level loras (no folder) go last
  if(rootItems.length){
    html += `<optgroup label="— Root —">`;
    rootItems.sort((a,b) => a.localeCompare(b)).forEach(l => {
      html += `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`;
    });
    html += `</optgroup>`;
  }

  return html;
}

/** LoRA keyword map — stored in localStorage, keyed by lora path */
function getLoraKeywordMap(){
  try{ return JSON.parse(localStorage.getItem('returncurrent_lora_keywords') || '{}'); }catch(e){ return {}; }
}
function setLoraKeyword(loraPath, keywords){
  const map = getLoraKeywordMap();
  if(keywords.trim()) map[loraPath] = keywords.trim();
  else delete map[loraPath];
  localStorage.setItem('returncurrent_lora_keywords', JSON.stringify(map));
}
function getLoraKeyword(loraPath){
  return getLoraKeywordMap()[loraPath] || '';
}

/** Get all active LoRA trigger keywords for display */
function getActiveTriggers(loraEntries){
  const all = [];
  loraEntries.forEach(entry => {
    if(!entry.on) return;
    const kw = getLoraKeyword(entry.lora);
    if(kw) all.push(...kw.split(',').map(s => s.trim()).filter(Boolean));
  });
  return all;
}

/** Organize checkpoint/model list by subfolder, prioritize model-matching folder */
function buildOrganizedSelectOptions(options, currentValue, apiGraph){
  if(!Array.isArray(options) || !options.length) return `<option value="${escapeHtml(String(currentValue || ''))}">${escapeHtml(String(currentValue || ''))}</option>`;
  // Detect current model folder for prioritization
  let modelHint = '';
  if(currentValue) modelHint = currentValue.replace(/\\/g,'/').split('/')[0].toLowerCase();

  const groups = {};
  const rootItems = [];
  options.forEach(opt => {
    const norm = String(opt).replace(/\\/g,'/');
    const slashIdx = norm.indexOf('/');
    if(slashIdx === -1){
      rootItems.push(opt);
    } else {
      const folder = norm.substring(0, slashIdx);
      if(!groups[folder]) groups[folder] = [];
      groups[folder].push(opt);
    }
  });

  const folderNames = Object.keys(groups).sort((a, b) => {
    const aMatch = modelHint && a.toLowerCase() === modelHint ? 0 : 1;
    const bMatch = modelHint && b.toLowerCase() === modelHint ? 0 : 1;
    if(aMatch !== bMatch) return aMatch - bMatch;
    return a.localeCompare(b);
  });

  let html = '';
  folderNames.forEach(folder => {
    const isMatch = modelHint && folder.toLowerCase() === modelHint;
    const label = isMatch ? `★ ${folder}` : folder;
    html += `<optgroup label="${escapeHtml(label)}">`;
    groups[folder].sort().forEach(opt => {
      const display = String(opt).replace(/\\/g,'/').split('/').pop();
      html += `<option value="${escapeHtml(String(opt))}" ${opt === currentValue ? 'selected' : ''}>${escapeHtml(display)}</option>`;
    });
    html += `</optgroup>`;
  });
  if(rootItems.length){
    html += `<optgroup label="— Root —">`;
    rootItems.sort().forEach(opt => {
      html += `<option value="${escapeHtml(String(opt))}" ${opt === currentValue ? 'selected' : ''}>${escapeHtml(String(opt))}</option>`;
    });
    html += `</optgroup>`;
  }
  return html;
}

    const isCompactCandidate = COMPACT_KEYS.includes(f.key) && f.kind === 'number';

        const groupKeys = isWH ? ['width','height'] : ['steps','cfg','denoise'];
        const siblings = fields.filter(ff => {
          if(ff._rendered) return false;
          if(!!ff.advanced !== !!f.advanced) return false; // don't mix advanced and main fields

            // Match width/height by nodeId (or subPaths for IdeogramStudio)
            const ffLastSeg = ff.subPaths ? ff.subPaths[0]?.[ff.subPaths[0].length-1] : ff.key;
            return (ffLastSeg === 'width' || ffLastSeg === 'height') && 
                   ff.kind === 'number' && ff.nodeId === f.nodeId;

    } else if(f.kind === 'lora_stack'){
      const loraOptionsHtml = buildOrganizedLoraOptions(state.currentWorkflow.apiGraph);

  main.innerHTML = html;
  document.getElementById('backToList').addEventListener('click', ()=>{

  // Advanced section toggle
  const advToggle = document.getElementById('advancedToggle');
  if(advToggle){
    advToggle.addEventListener('click', ()=>{

    });

  // wire inputs
  main.querySelectorAll('[data-field-idx]').forEach(el=>{

    btn.addEventListener('click', ()=>{

  main.querySelectorAll('[data-seed-lock]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.seedLock);
      fields[idx]._locked = !fields[idx]._locked;
      const locked = fields[idx]._locked;
      btn.classList.toggle('locked', locked);
      btn.textContent = locked ? '🔒' : '🔓';
      btn.title = locked ? "Seed locked — won't randomize on Generate" : 'Seed unlocked — randomizes on Generate';

  fields.forEach((f,i)=>{

      const libBtn = main.querySelector(`[data-library-idx="${i}"]`);

            f.value = btn.dataset.ratio;
            // Auto-calculate dimensions based on aspect ratio and current megapixels
            const [rw, rh] = btn.dataset.ratio.split(':').map(Number);
            const currentMP = (f.width * f.height) / 1e6;
            const mp = Math.max(currentMP, 0.5);
            const totalPx = mp * 1e6;
            const newW = Math.round(Math.sqrt(totalPx * rw / rh) / 16) * 16;
            const newH = Math.round(Math.sqrt(totalPx * rh / rw) / 16) * 16;
            f.width = newW;
            f.height = newH;
            // Update width/height fields if they exist
            const wField = fields.find(ff => ff.subPaths && ff.subPaths.some(p => p[p.length-1]==='width'));
            const hField = fields.find(ff => ff.subPaths && ff.subPaths.some(p => p[p.length-1]==='height'));
            if(wField){ wField.value = newW; const el = main.querySelector(`[data-field-idx="${fields.indexOf(wField)}"]`); if(el) el.value = newW; }
            if(hField){ hField.value = newH; const el = main.querySelector(`[data-field-idx="${fields.indexOf(hField)}"]`); if(el) el.value = newH; }

            const [rw, rh] = (f.value || '1:1').split(':').map(Number);

            if(rw >= rh){
              newH = base; newW = Math.round(base * rw / rh / 8) * 8;
            } else {
              newW = base; newH = Math.round(base * rh / rw / 8) * 8;
            }
            f.width = newW; f.height = newH;
            const wField = fields.find(ff => ff.subPaths && ff.subPaths.some(p => p[p.length-1]==='width'));
            const hField = fields.find(ff => ff.subPaths && ff.subPaths.some(p => p[p.length-1]==='height'));
            if(wField){ wField.value = newW; const el = main.querySelector(`[data-field-idx="${fields.indexOf(wField)}"]`); if(el) el.value = newW; }
            if(hField){ hField.value = newH; const el = main.querySelector(`[data-field-idx="${fields.indexOf(hField)}"]`); if(el) el.value = newH; }

    if(f.kind === 'quality_preset'){
      const qpContainer = main.querySelector(`[data-qp-field="${i}"]`);
      if(qpContainer){
        qpContainer.querySelectorAll('.qp-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            qpContainer.querySelectorAll('.qp-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const preset = btn.dataset.qp;
            f.value = preset;
            const stepMap = {turbo: 8, default: 20, quality: 35};
            f.steps = stepMap[preset];
            // Update steps field if visible
            const stepsField = fields.find(ff => ff.key === 'steps' && ff.kind === 'number');
            if(stepsField){
              stepsField.value = f.steps;
              const el = main.querySelector(`[data-field-idx="${fields.indexOf(stepsField)}"]`);
              if(el) el.value = f.steps;
            }
          });
        });
      }
    }
    // Color palette wiring
    if(f.kind === 'color_palette'){
      const paletteEl = main.querySelector(`[data-palette-field="${i}"]`);
      const hexRow = main.querySelector(`[data-hex-row="${i}"]`);
      if(paletteEl && hexRow){
        const picker = hexRow.querySelector(`[data-color-picker="${i}"]`);
        const hexInput = hexRow.querySelector(`[data-hex-input="${i}"]`);
        // + chip opens the hex row

        if(addBtn){
          addBtn.addEventListener('click', ()=>{
            hexRow.style.display = hexRow.style.display === 'none' ? 'flex' : 'none';
          });
        }
        // Color picker syncs to hex text
        picker.addEventListener('input', ()=>{ hexInput.value = picker.value; });
        // Hex text syncs to picker when valid
        hexInput.addEventListener('input', ()=>{
          if(/^#[0-9a-fA-F]{6}$/.test(hexInput.value)) picker.value = hexInput.value;
        });
        // Add button commits the color
        hexRow.querySelector(`[data-hex-confirm="${i}"]`).addEventListener('click', ()=>{
          let hex = hexInput.value.trim() || picker.value;
          if(!hex.startsWith('#')) hex = '#' + hex;
          if(!/^#[0-9a-fA-F]{6}$/.test(hex)){ toast('Invalid hex — use #rrggbb'); return; }
          if(f.value.length >= 12){ toast('Palette full (12 max)'); return; }
          f.value.push(hex.toLowerCase());
          renderEditor();
        });
        // Remove chips
        paletteEl.querySelectorAll('[data-chip-remove]').forEach(btn => {
          btn.addEventListener('click', (e)=>{
            e.stopPropagation();
            f.value.splice(parseInt(btn.dataset.chipRemove), 1);
            renderEditor();
          });
        });
      }
    }
    // RIFE toggle wiring
    if(f.kind === 'rife_toggle'){
      const bar = main.querySelector(`[data-rife-field="${i}"]`);
      if(bar){
        bar.addEventListener('click', ()=>{
          f.value = !f.value;
          bar.classList.toggle('on', f.value);
          bar.querySelector('.rife-status').textContent = f.value ? 'INTERPOLATION ON' : 'INTERPOLATION OFF';
        });
      }
    }
    // Wire lora_stack controls
    if(f.kind === 'lora_stack'){
      const stackEl = main.querySelector(`[data-lora-field-idx="${i}"]`);
      if(stackEl){
        // Set initial select values
        f.value.forEach((entry, li) => {
          const sel = stackEl.querySelector(`[data-lora-select="${li}"]`);
          if(sel) sel.value = entry.lora;
        });

        // Trigger keyword display updater
        const updateTriggers = () => {
          const triggers = getActiveTriggers(f.value);
          const el = document.getElementById(`triggerWords${i}`);
          if(el){
            if(triggers.length){
              el.textContent = triggers.join(', ');
              el.className = 'lora-triggers-words';
            } else {
              el.textContent = 'enable LoRAs with _keyword names';
              el.className = 'lora-triggers-empty';
            }
          }
        };
        updateTriggers(); // initial render

        // Copy triggers button
        const copyBtn = stackEl.querySelector(`[data-triggers-copy="${i}"]`);
        if(copyBtn){
          copyBtn.addEventListener('click', () => {
            const triggers = getActiveTriggers(f.value);
            if(!triggers.length){ toast('No active triggers'); return; }
            // Check if Ideogram workflow (has IdeogramStudio node)
            const isIdeogram = Object.values(state.currentWorkflow.apiGraph || {}).some(n => n.class_type === 'IdeogramStudio');
            const text = isIdeogram
              ? `"LoRA": "${triggers.join(', ')}"`
              : triggers.join(', ');
            copyToClipboard(text);
          });
        }

        // Toggle on/off
        stackEl.querySelectorAll('[data-lora-toggle]').forEach(btn => {
          btn.addEventListener('click', () => {
            const li = parseInt(btn.dataset.loraToggle);
            f.value[li].on = !f.value[li].on;
            btn.classList.toggle('on', f.value[li].on);
            btn.closest('.lora-entry').classList.toggle('disabled', !f.value[li].on);
            updateTriggers();
          });
        });
        // Select lora
        stackEl.querySelectorAll('[data-lora-select]').forEach(sel => {
          sel.addEventListener('change', () => {
            const li = parseInt(sel.dataset.loraSelect);
            f.value[li].lora = sel.value;
            // Update keyword input with stored keyword for new lora
            const kwInput = stackEl.querySelector(`[data-lora-kw="${li}"]`);
            if(kwInput) kwInput.value = getLoraKeyword(sel.value);
            updateTriggers();
          });
        });
        // Keyword inputs
        stackEl.querySelectorAll('[data-lora-kw]').forEach(input => {
          input.addEventListener('input', () => {
            const li = parseInt(input.dataset.loraKw);
            setLoraKeyword(f.value[li].lora, input.value);
            updateTriggers();
          });
        });
        // Strength slider ↔ number input two-way sync
        stackEl.querySelectorAll('[data-lora-strength]').forEach(slider => {
          slider.addEventListener('input', () => {
            const li = parseInt(slider.dataset.loraStrength);
            const v = parseFloat(slider.value);
            f.value[li].strength = v;
            const numInput = stackEl.querySelector(`[data-lora-str-display="${li}"]`);
            if(numInput) numInput.value = v;
          });
        });
        stackEl.querySelectorAll('[data-lora-str-display]').forEach(numInput => {
          numInput.addEventListener('input', () => {
            const li = parseInt(numInput.dataset.loraStrDisplay);
            const v = parseFloat(numInput.value);
            if(isNaN(v)) return;
            f.value[li].strength = v; // exact value, no clamping
            const slider = stackEl.querySelector(`[data-lora-strength="${li}"]`);
            if(slider) slider.value = Math.max(-2, Math.min(2, v)); // slider pegs at its range
          });
        });
        // Delete lora
        stackEl.querySelectorAll('[data-lora-delete]').forEach(btn => {
          btn.addEventListener('click', () => {
            const li = parseInt(btn.dataset.loraDelete);
            f.value.splice(li, 1);
            renderEditor();
          });
        });
        // Add lora
        const addBtn = stackEl.querySelector(`[data-lora-add="${i}"]`);
        if(addBtn){
          addBtn.addEventListener('click', () => {
            const nextIdx = f.value.length + 1;
            f.value.push({
              key: `lora_${nextIdx}`,
              on: true,
              lora: state.availableLoras[0] || '',
              strength: 1.0
            });
            renderEditor(); // re-render
          });
        }
      }
    }
  });

  // action bar
  actionBar.style.display = 'flex';
  actionBar.innerHTML = `
    <button class="secondary" id="saveWfBtn">Save</button>
    <button class="primary" id="queueBtn">Generate</button>
  `;
  document.getElementById('queueBtn').addEventListener('click', submitCurrentWorkflow);
  document.getElementById('saveWfBtn').addEventListener('click', ()=>toast('Saved to your workflow list'));
  updateQueueButton();
  }catch(e){
    console.error('renderEditor error:', e);
    main.innerHTML = `<div class="empty-state"><p style="color:var(--safelight)">Editor error: ${e.message}</p><p style="font-size:11px;color:var(--text-dim)">Check browser console for details</p></div>`;
  }
}

function onFieldChange(e){

  if(e.target.type === 'checkbox') f.value = e.target.checked;

/* ---- Submit workflow ----
   The graph is sent through exactly as extracted from the PNG, except for the
   specific keys the user actually edited. Nothing is rebuilt, validated, or
   guessed — unknown/custom nodes ride along completely untouched. */
async function submitCurrentWorkflow(){
  if(!state.connected){ toast('Not connected to server'); return; }
  
  // Auto-randomize seed unless locked by user
  const seedField = state.currentWorkflow.fields.find(f => f.key === 'seed' || f.key === 'noise_seed');
  if(seedField && !seedField._locked){
    const newSeed = Math.floor(Math.random()*1e15);
    seedField.value = newSeed;
    const seedIdx = state.currentWorkflow.fields.indexOf(seedField);
    const seedInput = main.querySelector(`[data-field-idx="${seedIdx}"]`);
    if(seedInput) seedInput.value = newSeed;
  }
  
  const {apiGraph, fields} = state.currentWorkflow;
  const graph = JSON.parse(JSON.stringify(apiGraph));
  fields.forEach(f=>{
    if(f.kind === 'rife_toggle'){
      if(!f.value && f.rifeInput){
        // Bypass RIFE: redirect all nodes that reference RIFE's output to RIFE's input source
        const rifeNodeId = f.nodeId;
        for(const nid in graph){
          const inputs = graph[nid].inputs;
          for(const key in inputs){
            if(Array.isArray(inputs[key]) && inputs[key][0] === rifeNodeId){
              inputs[key] = f.rifeInput; // point to what fed into RIFE
            }
          }
        }
        delete graph[rifeNodeId]; // remove RIFE node entirely
      }
    } else if(f.kind === 'quality_preset'){
      // Replace linked steps with direct preset value
      graph[f.nodeId].inputs.steps = f.steps;
    } else if(f.kind === 'lora_stack'){
      if(f._virtualPll && f.value.length > 0){
        // Inject a new Power Lora Loader node into the graph
        const pllId = '_pll_' + Date.now();
        const modelNid = f._modelLoaderNodeId;
        const clipNid = f._clipLoaderNodeId;
        const pllInputs = {
          model: [modelNid, 0],
          clip: clipNid ? [clipNid, 0] : [modelNid, 1]
        };
        f.value.forEach((entry, idx) => {
          pllInputs[`lora_${idx + 1}`] = {on: entry.on, lora: entry.lora, strength: entry.strength};
        });
        graph[pllId] = {class_type: 'Power Lora Loader (rgthree)', inputs: pllInputs};
        // Redirect all nodes using the model loader's output to use the PLL instead
        for(const nid in graph){
          if(nid === pllId) continue;
          const inputs = graph[nid].inputs;
          for(const key in inputs){
            if(Array.isArray(inputs[key]) && inputs[key][0] === modelNid && inputs[key][1] === 0){
              inputs[key] = [pllId, 0]; // model output
            }
            if(clipNid && Array.isArray(inputs[key]) && inputs[key][0] === clipNid && inputs[key][1] === 0){
              inputs[key] = [pllId, 1]; // clip output
            }
          }
        }
      } else if(!f._virtualPll){
        // Existing Power Lora Loader — rebuild entries
        const nodeInputs = graph[f.nodeId].inputs;
        for(const key in nodeInputs){
          if(/^lora_\d+$/.test(key)) delete nodeInputs[key];
        }
        f.value.forEach((entry, idx) => {
          nodeInputs[`lora_${idx + 1}`] = {on: entry.on, lora: entry.lora, strength: entry.strength};
        });
      }
    } else if(f.subPaths){
      // Nested field inside an object input (e.g., IdeogramStudio widget)
      const obj = graph[f.nodeId].inputs[f.key];
      f.subPaths.forEach(path => {
        let target = obj;
        for(let p = 0; p < path.length - 1; p++){
          if(!target[path[p]]) target[path[p]] = {};
          target = target[path[p]];
        }
        target[path[path.length - 1]] = f.value;
      });
    } else {
      graph[f.nodeId].inputs[f.key] = f.value;
    }
  });
  try{
    const res = await fetch(`${baseUrl()}/prompt`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt: graph, client_id: state.clientId})
    });
    const json = await res.json();
    if(json.error){
      toast('ComfyUI rejected this workflow — see console');
      console.error(json.error);
      return;
    }
    const promptId = json.prompt_id;
    state.activeJobs.set(promptId, {fields, timestamp: Date.now()});
    trackSubmittedPrompt(promptId);
    toast('Queued');
    document.getElementById('progressContainer').style.display = 'block';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressRow').innerHTML = `<span>QUEUED</span><span>${state.activeJobs.size} in queue</span>`;
    updateQueueButton();
  }catch(e){
    toast('Could not reach ComfyUI');
  }
}

    const qCount = state.activeJobs.size;
    btn.textContent = qCount > 0 ? `Generate (+${qCount})` : 'Generate';
  }

async function renderQueue(){

/* ---- Gallery tab ---- */

function formatGalleryDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const day = d.getDate();
  const suf = day===1||day===21||day===31?'st':day===2||day===22?'nd':day===3||day===23?'rd':'th';
  return `${months[d.getMonth()]} ${day}${suf}, ${d.getFullYear()}`;
}

function getItemDate(url){
  const m = state.galleryMeta[url];
  return m && m.ts ? formatGalleryDate(m.ts) : '';
}

function renderGallery(){
  actionBar.style.display = 'none';
  state.galleryDirty = false;
  if(!state.gallery.length){
    main.innerHTML = `<div class="empty-state"><div class="icon">▣</div><p>Nothing generated yet — your results will land here.</p></div>`;
    return;
  }
  const newCount = state.newImageCount || 0;
  state.newImageCount = 0;

  // If viewing an expanded group, show only that group's images
  if(state.galleryExpandedGroup){
    const groupUrls = state.gallery.filter(url => {
      const m = state.galleryMeta[url];
      return m && m.promptHash === state.galleryExpandedGroup;
    });
    renderGalleryTiles(groupUrls, 0, true);
    return;
  }

  // Group images by promptHash
  const groups = []; // [{urls:[], hash:string, cover:string}]
  const seen = new Set();
  for(const url of state.gallery){
    const m = state.galleryMeta[url];
    const hash = (m && m.promptHash) || url; // unique fallback for ungrouped
    if(seen.has(hash)){
      // Add to existing group
      const g = groups.find(g => g.hash === hash);
      if(g) g.urls.push(url);
    } else {
      seen.add(hash);
      groups.push({hash, urls:[url], cover: url});
    }
  }

  // Build display list: for single-image groups show the image, for multi show a group tile
  const displayItems = [];
  for(const g of groups){
    if(g.urls.length === 1){
      displayItems.push({type:'single', url: g.urls[0], hash: g.hash});
    } else {
      displayItems.push({type:'group', cover: g.cover, count: g.urls.length, hash: g.hash});
    }
  }

  const isNew = (url) => state.gallery.indexOf(url) < newCount;

  // Build HTML with date separators
  let gridHtml = '';
  let lastDate = '';
  displayItems.forEach((item, i) => {
    const url = item.type === 'group' ? item.cover : item.url;
    const dateStr = getItemDate(url);
    if(dateStr && dateStr !== lastDate){
      gridHtml += `<div class="gallery-date">${dateStr}</div>`;
      lastDate = dateStr;
    } else if(!dateStr && !lastDate && i === 0){
      // No date info for first items
    }
    const unseen = !state.seenImages.has(url);
    const classes = ['gallery-tile'];
    if(isNew(url)) classes.push('new-tile');
    if(unseen) classes.push('unseen');
    if(item.type === 'group') classes.push('group-tile');
    gridHtml += `
    <div class="${classes.join(' ')}" data-gallery-url="${escapeHtml(url)}" ${isNew(url) ? 'style="animation-delay:'+i*60+'ms"' : ''}>
      ${(()=>{
        const isVid = state.galleryMeta[url]?.video;
        const action = item.type === 'group' ? 'expand' : 'view';
        return isVid
          ? `<video src="${url}" muted loop preload="metadata" playsinline data-action="${action}" data-hash="${escapeHtml(item.hash)}" data-url="${escapeHtml(url)}" data-vid="1"></video>`
          : `<img src="${url}" loading="lazy" data-action="${action}" data-hash="${escapeHtml(item.hash)}" data-url="${escapeHtml(url)}">`;
      })()}
      <button class="gallery-download" data-download-url="${escapeHtml(url)}" title="Download">↓</button>
      <button class="gallery-remove" data-remove-url="${escapeHtml(url)}">✕</button>
      ${item.type === 'single' ? `<button class="gallery-iterate" data-iterate-url="${escapeHtml(url)}" title="Iterate">∞</button>` : ''}
      ${(()=>{
        const meta = state.galleryMeta[url];
        const isVid = meta && meta.video;
        if(item.type === 'group') return `${isVid ? '<span class="video-icon">▶</span>' : ''}<span class="group-badge">${item.count}</span>`;
        if(isVid) return '<span class="video-icon">▶</span>';
        return '';
      })()}
    </div>`;
  });
  main.innerHTML = `<div class="gallery-grid">${gridHtml}</div>`;

  wireGalleryEvents();
}

function renderGalleryTiles(urls, newCount, isExpanded){
  let header = '';
  if(isExpanded){
    header = `<button class="gallery-back-btn" id="galleryBack">‹ Back to gallery</button>`;
  }
  main.innerHTML = header + `<div class="gallery-grid">${urls.map((url, i) => {
    const unseen = !state.seenImages.has(url);
    const isNew = i < newCount;
    const classes = ['gallery-tile'];
    if(isNew) classes.push('new-tile');
    if(unseen) classes.push('unseen');
    return `
    <div class="${classes.join(' ')}" data-gallery-url="${escapeHtml(url)}" ${isNew ? 'style="animation-delay:'+i*60+'ms"' : ''}>
      ${state.galleryMeta[url]?.video
        ? `<video src="${url}" muted loop preload="metadata" playsinline data-action="view" data-url="${escapeHtml(url)}" data-vid="1"></video>`
        : `<img src="${url}" loading="lazy" data-action="view" data-url="${escapeHtml(url)}">`}
      <button class="gallery-download" data-download-url="${escapeHtml(url)}" title="Download">↓</button>
      <button class="gallery-remove" data-remove-url="${escapeHtml(url)}">✕</button>
      <button class="gallery-iterate" data-iterate-url="${escapeHtml(url)}" title="Iterate">∞</button>
    </div>`;
  }).join('')}</div>`;

  if(isExpanded){
    document.getElementById('galleryBack').addEventListener('click', ()=>{
      state.galleryExpandedGroup = null;
      renderGallery();
    });
  }
  wireGalleryEvents();
}

function wireGalleryEvents(){
  // Image click: view or expand group
  main.querySelectorAll('[data-action]').forEach(img=>{
    img.addEventListener('click', ()=>{
      if(img.dataset.action === 'expand'){
        state.galleryExpandedGroup = img.dataset.hash;
        history.pushState({galleryGroup: true}, '');
        renderGallery();
      } else {
        markImageSeen(img.dataset.url);
        const idx = state.gallery.indexOf(img.dataset.url);
        if(idx >= 0) openLightbox(idx);
      }
    });
  });
  main.querySelectorAll('[data-remove-url]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const url = btn.dataset.removeUrl;
      deleteGalleryImage(url);
    });
  });
  main.querySelectorAll('[data-iterate-url]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      markImageSeen(btn.dataset.iterateUrl);
      loadWorkflowFromGalleryImage(btn.dataset.iterateUrl);
    });
  });
  main.querySelectorAll('[data-download-url]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      downloadGalleryImage(btn.dataset.downloadUrl);
    });
  });

  // Auto-play video thumbnails when they scroll into the center ~40% of viewport
  const videoThumbs = main.querySelectorAll('video[data-vid]');
  if(videoThumbs.length){
    if(state._galleryVideoObserver) state._galleryVideoObserver.disconnect();
    state._galleryVideoObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const vid = entry.target;
        if(entry.isIntersecting){
          vid.currentTime = 0;
          vid.play().catch(()=>{});
        } else {
          vid.pause();
          vid.currentTime = 0;
        }
      });
    }, {
      root: null,
      rootMargin: '-30% 0px -30% 0px', // center 40% of viewport
      threshold: 0.3
    });
    videoThumbs.forEach(v => state._galleryVideoObserver.observe(v));
  }
}


async function loadWorkflowFromGalleryImage(url){
  toast('Extracting workflow…');
  try{
    // For videos, swap the file extension to .png in the URL to get the workflow metadata
    const meta = state.galleryMeta[url];
    let fetchUrl = url;
    if(meta && meta.video){
      fetchUrl = url.replace(/filename=([^&]+)/, (m, fname) => {
        const decoded = decodeURIComponent(fname);
        const pngName = decoded.replace(/\.[^.]+$/, '.png');
        return 'filename=' + encodeURIComponent(pngName);
      });
      console.log('Video iterate: swapped to', fetchUrl);
    }
    const res = await fetch(fetchUrl);
    const blob = await res.blob();
    const file = new File([blob], 'iterate.png', {type:'image/png'});
    const {apiGraph, uiGraph} = await extractWorkflowFromPng(file);
    const titleMap = getUiTitleMap(uiGraph);
    const fields = buildEditableFields(apiGraph, titleMap);
    const thumb = (meta && meta.video) ? '' : url;
    const name = 'Iteration';
    const saved = {name, apiGraph, titleMap, thumb, fieldCount: fields.length};
    state.currentWorkflow = {saved, apiGraph, fields};
    history.pushState({editor: true}, '');
    toast(`Loaded — ${fields.length} fields. Seed preserved for iteration.`);
    renderTab('workflows');
  }catch(e){
    toast(e.message || 'No workflow data embedded in this file');
    console.error(e);
  }
}

          <div class="tools-history-item" data-th-idx="${i}">
            <div class="th-preview">${escapeHtml(h.text.slice(0,60))}</div>
            <div class="th-date">${new Date(h.ts).toLocaleDateString()}</div>
            <button class="th-delete" data-th-delete="${i}">✕</button>
          </div>
        `).join('');
    })()}
  `;

  // Mode toggle
  main.querySelectorAll('[data-tools-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.toolsMode = btn.dataset.toolsMode;
      state.toolsResult = '';
      renderTools();
    });
  });

  // Text draft persistence
  const textInput = document.getElementById('toolsTextInput');
  if(textInput) textInput.addEventListener('input', ()=> state._toolsTextDraft = textInput.value);

  // Image upload — store as blob immediately so it survives DOM re-renders
  const imgInput = document.getElementById('toolsImgInput');
  if(imgInput){
    imgInput.addEventListener('change', async e=>{
      if(e.target.files[0]){
        const file = e.target.files[0];
        const buf = await file.arrayBuffer();
        state.toolsImageBlob = new Blob([buf], {type: file.type || 'image/png'});
        state.toolsImageName = file.name || 'tools_input.png';
        state.toolsImageUrl = URL.createObjectURL(state.toolsImageBlob);
        renderTools();
      }
    });
  }
  // Show existing preview
  if(state.toolsImageUrl){
    const preview = document.getElementById('toolsImgPreview');
    if(preview) preview.src = state.toolsImageUrl;
  }

  // Generate button
  document.getElementById('toolsGenBtn').addEventListener('click', ()=> runToolsGenerate());

  // Copy button
  const copyBtn = document.getElementById('toolsCopyBtn');
  if(copyBtn){
    copyBtn.addEventListener('click', ()=>{
      copyToClipboard(state.toolsResult);
    });
  }

  // History item handlers
  main.querySelectorAll('[data-th-idx]').forEach(item => {
    item.addEventListener('click', (e)=>{
      if(e.target.closest('.th-delete')) return;
      const idx = parseInt(item.dataset.thIdx);
      const history = getToolsHistory();
      if(history[idx]){
        state.toolsResult = history[idx].text;
        renderTools();
      }
    });
  });
  main.querySelectorAll('[data-th-delete]').forEach(btn => {
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = parseInt(btn.dataset.thDelete);
      const history = getToolsHistory();
      history.splice(idx, 1);
      localStorage.setItem('returncurrent_tools_history', JSON.stringify(history));
      renderTools();
    });
  });
}

function getToolsHistory(){
  try{ return JSON.parse(localStorage.getItem('returncurrent_tools_history') || '[]'); }catch(e){ return []; }
}
function saveToolsHistory(text){
  const history = getToolsHistory();
  history.unshift({text, ts: Date.now()});
  localStorage.setItem('returncurrent_tools_history', JSON.stringify(history.slice(0, 50)));
}

/** Clipboard copy with fallback for non-HTTPS contexts */
function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=> toast('Copied')).catch(()=> fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); toast('Copied'); }
  catch(e){ toast('Copy failed — select manually'); }
  document.body.removeChild(ta);
}

/** Extract clean JSON prompt from LLM output (strips thinking, markdown fences, etc.) */
function extractJsonPrompt(rawText){
  // 1. Try extracting from ```json ... ``` code blocks — take the LAST one (most refined)
  const codeBlockRegex = /```(?:json)?\s*(\{[\s\S]*?\})\s*```/g;
  let lastBlock = null;
  let match;
  while((match = codeBlockRegex.exec(rawText)) !== null){
    lastBlock = match[1];
  }
  if(lastBlock){
    try{ JSON.parse(lastBlock); return lastBlock.trim(); }catch(e){}
  }

  // 2. Try finding raw JSON object with "prompt" key (no code fence)
  const rawJsonRegex = /\{[^]*?"prompt"\s*:\s*"[^]*?\}/g;
  let lastRaw = null;
  while((match = rawJsonRegex.exec(rawText)) !== null){
    lastRaw = match[0];
  }
  if(lastRaw){
    try{ JSON.parse(lastRaw); return lastRaw.trim(); }catch(e){}
  }

  // 3. Fallback: strip <|channel>thought blocks and common LLM junk, return whatever remains
  let cleaned = rawText
    .replace(/<\|channel>thought[\s\S]*?(?=\{)/i, '')  // strip thinking before first {
    .replace(/```(?:json)?/g, '')                       // strip code fence markers
    .trim();
  // Try to find valid JSON in what's left
  const firstBrace = cleaned.indexOf('{');
  const lastBrace = cleaned.lastIndexOf('}');
  if(firstBrace !== -1 && lastBrace > firstBrace){
    const candidate = cleaned.slice(firstBrace, lastBrace + 1);
    try{ JSON.parse(candidate); return candidate.trim(); }catch(e){}
    return candidate.trim(); // return even if not valid JSON — let user fix it
  }
  return cleaned || rawText;
}

async function fetchToolsNodeInfo(){
  if(state.toolsNodeInfo) return state.toolsNodeInfo;
  const textName = 'Expo Lmstudio Text Generation';
  const imgName = 'Expo Lmstudio Unified';
  const [textRes, imgRes] = await Promise.all([
    fetch(`${baseUrl()}/object_info/${encodeURIComponent(textName)}`).then(r=>r.json()).catch(()=>null),
    fetch(`${baseUrl()}/object_info/${encodeURIComponent(imgName)}`).then(r=>r.json()).catch(()=>null)
  ]);
  state.toolsNodeInfo = {
    text: textRes ? textRes[textName] : null,
    img: imgRes ? imgRes[imgName] : null
  };
  console.log('Tools node info:', state.toolsNodeInfo);
  return state.toolsNodeInfo;
}

/** Build an inputs dict from object_info, filling defaults and overrides */
function buildNodeInputs(nodeInfo, overrides){
  const inputs = {};
  if(!nodeInfo || !nodeInfo.input) return overrides || {};
  const required = nodeInfo.input.required || {};
  const optional = nodeInfo.input.optional || {};
  const all = {...required, ...optional};
  for(const [key, def] of Object.entries(all)){
    if(overrides && overrides[key] !== undefined){
      inputs[key] = overrides[key];
    } else if(Array.isArray(def) && Array.isArray(def[0])){
      // COMBO type — use first option as default
      inputs[key] = def[0][0];
    } else if(Array.isArray(def) && def[1] && def[1].default !== undefined){
      inputs[key] = def[1].default;
    }
  }
  // Add any overrides for keys not in the schema (like links)
  if(overrides){
    for(const [k, v] of Object.entries(overrides)){
      if(inputs[k] === undefined) inputs[k] = v;
    }
  }
  return inputs;
}

async function runToolsGenerate(){
  if(!state.connected){ toast('Not connected to server'); return; }

  const statusEl = document.getElementById('toolsStatus');
  const genBtn = document.getElementById('toolsGenBtn');
  genBtn.disabled = true;
  statusEl.textContent = 'Discovering node inputs…';

  let info;
  try{
    info = await fetchToolsNodeInfo();
  }catch(e){
    statusEl.textContent = 'Could not fetch node info';
    genBtn.disabled = false;
    return;
  }

  const mode = state.toolsMode;
  let graph;

  if(mode === 'text2json'){
    const inputText = (state._toolsTextDraft || '').trim();
    if(!inputText){ toast('Enter some text first'); genBtn.disabled = false; statusEl.textContent=''; return; }
    if(!info.text){
      statusEl.textContent = 'Expo Lmstudio Text Generation not found on server';
      genBtn.disabled = false;
      return;
    }
    const req = info.text.input.required || {};
    const opt = info.text.input.optional || {};
    const allInputNames = [...Object.keys(req), ...Object.keys(opt)];
    console.log('Text Gen node inputs:', allInputNames);
    statusEl.textContent = 'Inputs: ' + allInputNames.join(', ');

    const overrides = {};
    for(const key of allInputNames){
      const kl = key.toLowerCase();
      if(kl === 'prompt' || kl === 'text_input' || kl === 'user_prompt' || kl === 'input_text' || kl === 'text')
        overrides[key] = inputText;
      else if(kl.includes('system')) overrides[key] = TOOLS_SYSTEM_TEXT2JSON;
      else if(kl === 'model' || kl === 'model_key' || kl === 'model_name') overrides[key] = 'google/gemma-4-12b';
      else if(kl === 'seed') overrides[key] = Math.floor(Math.random()*1e15);
      else if(kl.includes('max_token') || kl.includes('max_length')) overrides[key] = 3000;
      else if(kl === 'temperature') overrides[key] = 0.7;
      else if(kl.includes('timeout')) overrides[key] = 300;
    }
    const nodeInputs = buildNodeInputs(info.text, overrides);
    console.log('Built inputs:', nodeInputs);
    graph = {
      "1": { "class_type": "Expo Lmstudio Text Generation", "inputs": nodeInputs },
      "2": { "class_type": "ShowText|pysssss", "inputs": {"text": ["1", 0]} }
    };
  } else {
    if(!state.toolsImageBlob){ toast('Upload an image first'); genBtn.disabled = false; statusEl.textContent=''; return; }
    if(!info.img){
      statusEl.textContent = 'Expo Lmstudio Unified not found on server';
      genBtn.disabled = false;
      return;
    }
    statusEl.textContent = 'Uploading image…';
    let uploadedName;
    try{
      const formData = new FormData();
      formData.append('image', state.toolsImageBlob, state.toolsImageName);
      const upRes = await fetch(baseUrl() + '/upload/image', {method:'POST', body:formData});
      if(!upRes.ok){
        const errBody = await upRes.text().catch(()=>'');
        throw new Error('HTTP ' + upRes.status + ' ' + errBody.slice(0,100));
      }
      const upJson = await upRes.json();
      uploadedName = upJson.name;
      if(!uploadedName) throw new Error('No filename in response');
    }catch(e){
      statusEl.textContent = 'Upload failed: ' + e.message;
      console.error('Upload error:', e);
      genBtn.disabled = false;
      return;
    }
    const req = info.img.input.required || {};
    const opt = info.img.input.optional || {};
    const allInputNames = [...Object.keys(req), ...Object.keys(opt)];
    console.log('Unified node inputs:', allInputNames);

    const overrides = {};
    for(const key of allInputNames){
      const kl = key.toLowerCase();
      if(kl === 'prompt' || kl === 'text_input' || kl === 'user_prompt') overrides[key] = TOOLS_USER_IMG;
      else if(kl.includes('system')) overrides[key] = TOOLS_SYSTEM_IMG2JSON;
      else if(kl === 'model' || kl === 'model_key' || kl === 'model_name') overrides[key] = 'google/gemma-4-12b';
      else if(kl === 'image') overrides[key] = ["1", 0];
      else if(kl === 'seed') overrides[key] = Math.floor(Math.random()*1e15);
      else if(kl.includes('max_token') || kl.includes('max_length')) overrides[key] = 3000;
      else if(kl === 'temperature') overrides[key] = 0.7;
      else if(kl.includes('timeout')) overrides[key] = 300;
    }
    const nodeInputs = buildNodeInputs(info.img, overrides);
    console.log('Built inputs:', nodeInputs);
    graph = {
      "1": { "class_type": "LoadImage", "inputs": {"image": uploadedName} },
      "2": { "class_type": "Expo Lmstudio Unified", "inputs": nodeInputs },
      "3": { "class_type": "ShowText|pysssss", "inputs": {"text": ["2", 0]} }
    };
  }

  statusEl.textContent = 'Submitting to LM Studio…';
  console.log('Tools graph:', JSON.stringify(graph, null, 2));

  try{
    const res = await fetch(baseUrl() + '/prompt', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt: graph, client_id: state.clientId})
    });
    const json = await res.json();
    if(json.error){
      statusEl.textContent = 'Rejected — check browser console';
      console.error('ComfyUI error:', json);
      genBtn.disabled = false;
      return;
    }
    const promptId = json.prompt_id;
    statusEl.textContent = 'Waiting for LLM… (30-90s)';

    for(let attempt = 0; attempt < 180; attempt++){
      await new Promise(r => setTimeout(r, 2000));
      try{
        const hRes = await fetch(baseUrl() + '/history/' + promptId);
        const hist = await hRes.json();
        const entry = hist[promptId];
        if(entry && entry.outputs){
          for(const nodeId in entry.outputs){
            const out = entry.outputs[nodeId];
            if(out.text){
              const rawText = Array.isArray(out.text) ? out.text.join('') : String(out.text);
              state.toolsResult = extractJsonPrompt(rawText);
              saveToolsHistory(state.toolsResult);
              genBtn.disabled = false;
              statusEl.textContent = 'Done — JSON prompt extracted';
              renderTools();
              return;
            }
          }
        }
      }catch(e){}
      if(statusEl) statusEl.textContent = 'Waiting for LLM… ' + ((attempt+1)*2) + 's';
    }
    statusEl.textContent = 'Timed out';
    genBtn.disabled = false;
  }catch(e){
    statusEl.textContent = 'Could not reach ComfyUI';
    console.error(e);
    genBtn.disabled = false;
  }
}

function openLightbox(idx){
  // Determine the image list to navigate (expanded group or full gallery)
  const imageList = state.galleryExpandedGroup
    ? state.gallery.filter(u => { const m = state.galleryMeta[u]; return m && m.promptHash === state.galleryExpandedGroup; })
    : state.gallery;
  let current = Math.max(0, imageList.indexOf(state.gallery[idx]));
  if(current < 0) current = 0;

  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  state._lightboxOpen = true;
  history.pushState({lightbox: true}, '');

  let autopanTimer = null;
  let autopanInterval = null;
  let holdIndicator = null;

  function stopAutopan(){
    clearTimeout(autopanTimer); autopanTimer = null;
    clearInterval(autopanInterval); autopanInterval = null;
    if(holdIndicator){ holdIndicator.remove(); holdIndicator = null; }
  }

  function render(){
    stopAutopan();
    const url = imageList[current];
    const total = imageList.length;
    const meta = state.galleryMeta[url];
    const isVid = meta && meta.video;
    const fillWidth = Math.max(100 / total, 4);
    const fillLeft = total > 1 ? (current / (total - 1)) * (100 - fillWidth) : 0;
    const showCarousel = total > 1;
    const mediaHtml = isVid
      ? `<video src="${url}" class="lightbox-img" autoplay loop muted playsinline></video>`
      : `<img src="${url}" class="lightbox-img">`;
    overlay.innerHTML = `
      <div class="lightbox-topbar">
        <span style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">${current+1} / ${total}</span>
        <span class="lightbox-close">✕</span>
      </div>
      ${showCarousel ? `<div class="lightbox-carousel"><div class="lightbox-carousel-fill" style="width:${fillWidth}%;left:${fillLeft}%"></div></div>` : ''}
      ${mediaHtml}
      <div class="lightbox-bottombar">
        <button class="lightbox-iterate" title="Iterate">∞</button>
        <button class="lightbox-dl" title="Download">↓</button>
      </div>
    `;
    overlay.querySelector('.lightbox-close').addEventListener('click', close);
    overlay.querySelector('.lightbox-dl').addEventListener('click', ()=> downloadGalleryImage(url));
    overlay.querySelector('.lightbox-iterate').addEventListener('click', ()=>{
      markImageSeen(url);
      close();
      loadWorkflowFromGalleryImage(url);
    });

    // Block browser long-press context menu on the image
    const img = overlay.querySelector('.lightbox-img');
    img.addEventListener('contextmenu', e => e.preventDefault());

    // Touch: swipe + continuous-zone long-press auto-pan
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0, swiping = false;
    let currentZone = 0; // -1=left, 0=middle, 1=right
    let zoneEnteredAt = 0;
    let autopanDir = 0;

    function getZone(x){
      const rect = img.getBoundingClientRect();
      const rel = (x - rect.left) / rect.width;
      return rel < 0.3 ? -1 : rel > 0.7 ? 1 : 0;
    }

    function updatePartial(){
      const carouselFill = overlay.querySelector('.lightbox-carousel-fill');
      if(carouselFill){
        const fw = Math.max(100/total, 4);
        const fl = total > 1 ? (current/(total-1))*(100-fw) : 0;
        carouselFill.style.width = fw+'%';
        carouselFill.style.left = fl+'%';
      }
      const curUrl = imageList[current];
      const curMeta = state.galleryMeta[curUrl];
      const curIsVid = curMeta && curMeta.video;
      const mediaEl = overlay.querySelector('.lightbox-img');
      if(mediaEl){
        if(curIsVid && mediaEl.tagName === 'IMG'){
          const vid = document.createElement('video');
          vid.src = curUrl; vid.className = 'lightbox-img';
          vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
          mediaEl.replaceWith(vid);
        } else if(!curIsVid && mediaEl.tagName === 'VIDEO'){
          const img = document.createElement('img');
          img.src = curUrl; img.className = 'lightbox-img';
          mediaEl.replaceWith(img);
        } else {
          mediaEl.src = curUrl;
        }
      }
      const counter = overlay.querySelector('.lightbox-topbar span');
      if(counter) counter.textContent = `${current+1} / ${total}`;
    }

    function enterZone(dir){
      currentZone = dir;
      zoneEnteredAt = Date.now();
      autopanDir = 0;
      clearInterval(autopanInterval); autopanInterval = null;

      if(dir === 0 || total <= 1){
        // Middle zone or single image — remove indicator
        if(holdIndicator){ holdIndicator.remove(); holdIndicator = null; }
        return;
      }
      // Show pulsating chevron
      if(holdIndicator) holdIndicator.remove();
      holdIndicator = document.createElement('div');
      holdIndicator.className = `autopan-indicator ${dir < 0 ? 'left' : 'right'}`;
      holdIndicator.textContent = dir < 0 ? '‹' : '›';
      overlay.appendChild(holdIndicator);

      // Start charge timer (700ms hold to activate)
      clearTimeout(autopanTimer);
      autopanTimer = setTimeout(()=>{
        swiping = false;
        autopanDir = dir;
        // Flash the chevron out
        if(holdIndicator){
          holdIndicator.style.animation = 'autopanFlash .3s ease-out forwards';
          setTimeout(()=>{ if(holdIndicator){holdIndicator.remove(); holdIndicator=null;} }, 300);
        }
        // Advance immediately
        advanceAutopan(dir);
        // Then keep going every 2.2s
        autopanInterval = setInterval(()=> advanceAutopan(dir), 2200);
      }, 700);
    }

    function advanceAutopan(dir){
      if(dir > 0 && current < total - 1){ current++; markImageSeen(imageList[current]); updatePartial(); }
      else if(dir < 0 && current > 0){ current--; updatePartial(); }
      else { stopAutopan(); } // hit the end
    }

    img.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
      swiping = true;
      stopAutopan();
      enterZone(getZone(touchStartX));
    }, {passive:true});

    img.addEventListener('touchmove', e => {
      const x = e.touches[0].clientX;
      const newZone = getZone(x);
      if(newZone !== currentZone){
        // Zone changed — restart charge for new zone (or clear if middle)
        enterZone(newZone);
      }
    }, {passive:true});

    img.addEventListener('touchend', e => {
      const held = Date.now() - touchStartTime;
      const wasAutopanning = !!autopanDir;
      stopAutopan();
      if(wasAutopanning || !swiping) return;
      swiping = false;
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const dx = endX - touchStartX;
      const dy = endY - touchStartY;
      const dist = Math.sqrt(dx*dx + dy*dy);

      // Quick tap in left/right 30% zone → advance one image
      if(held < 300 && dist < 15 && total > 1){
        const zone = getZone(touchStartX);
        if(zone > 0 && current < total - 1){ current++; markImageSeen(imageList[current]); render(); return; }
        if(zone < 0 && current > 0){ current--; render(); return; }
      }
      // Normal swipe
      if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) && held < 600){
        if(dx < 0 && current < total - 1){ current++; markImageSeen(imageList[current]); render(); }
        else if(dx > 0 && current > 0){ current--; render(); }
      }
    }, {passive:true});

    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
  }

  function close(){
    stopAutopan();
    state._lightboxOpen = false;
    overlay.remove();
    if(history.state && history.state.lightbox) history.back();
  }

  document.body.appendChild(overlay);
  render();
}
